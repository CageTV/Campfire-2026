EditorID: _Camp_legacyconfig_showboots_off
Description:
  TargetLanguage: English
  Value: >-
    Show Boots in Tent


    If enabled, your worn boots or shoes will be removed from your character and placed in and around your tent when sitting or sleeping on your bed roll.


    Note: Self-enchanted foot gear will not re-apply enchantment effects after getting out of a tent. This is a game engine issue. Disable if you use self-enchanted foot gear.


    Current Setting: Disabled
