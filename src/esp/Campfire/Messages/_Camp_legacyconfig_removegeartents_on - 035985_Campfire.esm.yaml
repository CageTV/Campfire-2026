  Value: >-
    Remove Gear in Tents (Player)


    If enabled (default), you will remove certain pieces of gear and place them in and around your tent when you sit or sleep on your bed roll. (Skyrim VR: Equipment appears when inside your tent.)


    Which pieces of gear are removed and displayed can be configured under Tents.


    Current Setting: Enabled
