EditorID: _Camp_legacyconfig_showhelm_on
Description:
  TargetLanguage: English
  Value: >-
    Show Helm in Tent


    If enabled, your worn helm or hat will be removed from your character and placed in and around your tent when sitting or sleeping on your bed roll.


    Note: Self-enchanted head gear will not re-apply enchantment effects after getting out of a tent. This is a game engine issue. Disable if you use self-enchanted head gear.


    Current Setting: Enabled
