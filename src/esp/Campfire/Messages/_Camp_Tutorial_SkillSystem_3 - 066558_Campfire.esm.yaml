Description:
  TargetLanguage: English
  Value: >-
    These skills have unique methods of progression. Click the "About Skill" option when selecting a node to learn more about the skill and how to advance it.


    If more than one skill is available, special torchbugs will appear. Selecting them will display the previous or next skill.


    To exit the skill system, select the red torchbug, or simply walk away from the campfire.
